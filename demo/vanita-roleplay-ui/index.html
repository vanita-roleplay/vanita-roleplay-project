<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANITA ROLEPLAY — HUD Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="../shared/vanita.css">
<script src="../shared/vanita.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="game-stage" id="gameStage">
  <!-- Shared icon gradients (silver / state tints) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gHeartSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8eaee"/><stop offset="1" stop-color="#abafb8"/></linearGradient>
      <linearGradient id="gHeartPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdce1"/><stop offset="1" stop-color="#ff8d9f"/></linearGradient>
      <linearGradient id="gHeartRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5d74"/><stop offset="1" stop-color="#cd1a38"/></linearGradient>
      <linearGradient id="gIcon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#9ea6b2"/></linearGradient>
      <linearGradient id="gShield" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ecf1"/><stop offset="0.5" stop-color="#d2d7de"/><stop offset="0.5" stop-color="#8d94a1"/><stop offset="1" stop-color="#a8aeba"/></linearGradient>
    </defs>
  </svg>


  <!-- Gameplay backdrop (stand-in for the GTA game world) -->
  <div class="scene"></div>
  <div class="scene-vignette"></div>

  <!-- Brand mark -->
  <div class="brandmark">
    <img src="../shared/vanita-logo@2x.png" alt="VANITA ROLEPLAY" class="brandmark-logo">
    <div class="brandmark-sub">LOS SANTOS &middot; SAN ANDREAS</div>
  </div>

  <!-- ============ DEV / PROTOTYPE CONTROL DRAWER ============ -->
  <div class="dev-drawer" id="devDrawer">
    <button class="vn-icon-btn" id="devToggle" aria-label="Toggle prototype controls">
      <i class="icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M0 416c0 17.7 14.3 32 32 32l54.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 448c17.7 0 32-14.3 32-32s-14.3-32-32-32l-246.7 0c-12.3-28.3-40.5-48-73.3-48s-61 19.7-73.3 48L32 384c-17.7 0-32 14.3-32 32zm128 0a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zM320 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm32-80c-32.8 0-61 19.7-73.3 48L32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l246.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48l54.7 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-54.7 0c-12.3-28.3-40.5-48-73.3-48zM192 128a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm73.3-64C253 35.7 224.8 16 192 16s-61 19.7-73.3 48L32 64C14.3 64 0 78.3 0 96s14.3 32 32 32l86.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 128c17.7 0 32-14.3 32-32s-14.3-32-32-32L265.3 64z"/></svg></i>
    </button>

    <div class="dev-panel" id="devPanel">
      <div class="dev-panel-head">
        <span>PROTOTYPE CONTROLS</span>
        <span class="dev-panel-tag">mock data</span>
      </div>

      <div class="dev-field">
        <label for="rangeHealth">Health <em id="valHealth">75</em></label>
        <input type="range" id="rangeHealth" min="0" max="100" value="75" class="dev-range dev-range-health">
      </div>
      <div class="dev-field">
        <label for="rangeArmor">Armor <em id="valArmor">60</em></label>
        <input type="range" id="rangeArmor" min="0" max="100" value="60" class="dev-range dev-range-armor">
      </div>
      <div class="dev-field">
        <label for="rangeHunger">Hunger <em id="valHunger">82</em></label>
        <input type="range" id="rangeHunger" min="0" max="100" value="82" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeThirst">Thirst <em id="valThirst">68</em></label>
        <input type="range" id="rangeThirst" min="0" max="100" value="68" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeStamina">Stamina <em id="valStamina">91</em></label>
        <input type="range" id="rangeStamina" min="0" max="100" value="91" class="dev-range">
      </div>

      <div class="dev-panel-head dev-panel-head--sub">
        <span>ACTION PROGRESS</span>
      </div>
      <div class="dev-field">
        <label for="rangeMedkit">Using Medkit <em id="valMedkit">72</em></label>
        <input type="range" id="rangeMedkit" min="0" max="100" value="72" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeArmorAction">Equipping Armor <em id="valArmorAction">56</em></label>
        <input type="range" id="rangeArmorAction" min="0" max="100" value="56" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeVehicle">Repairing Vehicle <em id="valVehicle">38</em></label>
        <input type="range" id="rangeVehicle" min="0" max="100" value="38" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeFuel">Refueling <em id="valFuel">61</em></label>
        <input type="range" id="rangeFuel" min="0" max="100" value="61" class="dev-range">
      </div>
      <div class="dev-field">
        <label for="rangeLockpick">Lockpicking <em id="valLockpick">45</em></label>
        <input type="range" id="rangeLockpick" min="0" max="100" value="45" class="dev-range">
      </div>

      <div class="dev-actions">
        <button id="btnRandomize" class="dev-btn">
          <i class="icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M403.8 34.4c12-5 25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6l0-32-32 0c-10.1 0-19.6 4.7-25.6 12.8L284 229.3 244 176l31.2-41.6C293.3 110.2 321.8 96 352 96l32 0 0-32c0-12.9 7.8-24.6 19.8-29.6zM164 282.7L204 336l-31.2 41.6C154.7 401.8 126.2 416 96 416l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l64 0c10.1 0 19.6-4.7 25.6-12.8L164 282.7zm274.6 188c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6l0-32-32 0c-30.2 0-58.7-14.2-76.8-38.4L121.6 172.8c-6-8.1-15.5-12.8-25.6-12.8l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l64 0c30.2 0 58.7 14.2 76.8 38.4L326.4 339.2c6 8.1 15.5 12.8 25.6 12.8l32 0 0-32c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64z"/></svg></i> Randomize
        </button>
        <button id="btnHeal" class="dev-btn dev-btn-ghost">
          <i class="icon"><svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg></i> Simulate Heal
        </button>
      </div>
    </div>
  </div>

  <!-- ============ MAIN PLAYER HUD (bottom-left overlay) ============ -->
  <div class="hud-shell">
    <div class="hud" id="playerHud" data-state="normal">

      <!-- Angled frame: two joined panels (bars + status), drawn from vector paths -->
      <svg class="hud-frame" viewBox="0 0 1000 145" aria-hidden="true">
        <defs>
          <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0e1016" stop-opacity="0.88"/>
            <stop offset="1" stop-color="#06080c" stop-opacity="0.93"/>
          </linearGradient>
        </defs>
        <path class="frame-fill" fill="url(#gPanel)" d="M120,15.75 L178.75,15.75 L188.75,25 L689,25 L694,30 L694,116 L128,116 L110,71 Z"/>
        <path class="frame-fill" fill="url(#gPanel)" d="M694,31 L940,31 L997,113 L990,124 L710,124 L702,116 L694,116 Z"/>
        <path class="frame-line" d="M120,15.75 L178.75,15.75 L188.75,25 L689,25 L694,30 L694,116 L128,116"/>
        <path class="frame-line" d="M694,31 L940,31 L997,113 L990,124 L710,124 L702,116 L694,116"/>
      </svg>

      <div class="hud-mist"></div>

      <!-- Health / Armor bars -->
      <div class="bar bar-health" id="healthBarTrack" title="Scroll to adjust (prototype only)">
        <div class="bar-track"></div>
        <div class="bar-fill" id="healthBar"></div>
      </div>
      <div class="bar bar-armor" id="armorBarTrack" title="Scroll to adjust (prototype only)">
        <div class="bar-track"></div>
        <div class="bar-fill" id="armorBar"></div>
      </div>
      <div class="bar-value value-health" id="healthValue"><b>75</b><span>/ 100</span></div>
      <div class="bar-value value-armor" id="armorValue"><b>60</b><span>/ 100</span></div>

      <!-- Status icons -->
      <div class="status-item" data-stat="hunger" title="Hunger">
        <div class="status-badge"><i class="icon"><svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M416 0C400 0 288 32 288 176l0 112c0 35.3 28.7 64 64 64l32 0 0 128c0 17.7 14.3 32 32 32s32-14.3 32-32l0-128 0-112 0-208c0-17.7-14.3-32-32-32zM64 16C64 7.8 57.9 1 49.7 .1S34.2 4.6 32.4 12.5L2.1 148.8C.7 155.1 0 161.5 0 167.9c0 45.9 35.1 83.6 80 87.7L80 480c0 17.7 14.3 32 32 32s32-14.3 32-32l0-224.4c44.9-4.1 80-41.8 80-87.7c0-6.4-.7-12.8-2.1-19.1L191.6 12.5c-1.8-8-9.3-13.3-17.4-12.4S160 7.8 160 16l0 134.2c0 5.4-4.4 9.8-9.8 9.8c-5.1 0-9.3-3.9-9.8-9L127.9 14.6C127.2 6.3 120.3 0 112 0s-15.2 6.3-15.9 14.6L83.7 151c-.5 5.1-4.7 9-9.8 9c-5.4 0-9.8-4.4-9.8-9.8L64 16zm48.3 152l-.3 0-.3 0 .3-.7 .3 .7z"/></svg></i></div>
        <div class="status-underline"><i style="width:82%" id="hungerBar"></i></div>
      </div>
      <div class="status-item" data-stat="thirst" title="Thirst">
        <div class="status-badge"><i class="icon"><svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg"><path d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z"/></svg></i></div>
        <div class="status-underline"><i style="width:68%" id="thirstBar"></i></div>
      </div>
      <div class="status-item" data-stat="armor" title="Armor">
        <div class="status-badge"><i class="icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0z"/></svg></i></div>
        <div class="status-underline"><i style="width:60%" id="armorMiniBar"></i></div>
      </div>
      <div class="status-item" data-stat="stamina" title="Stamina">
        <div class="status-badge"><i class="icon"><svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M320 48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM125.7 175.5c9.9-9.9 23.4-15.5 37.5-15.5c1.9 0 3.8 .1 5.6 .3L137.6 254c-9.3 28 1.7 58.8 26.8 74.5l86.2 53.9-25.4 88.8c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l28.7-100.4c5.9-20.6-2.6-42.6-20.7-53.9L238 299l30.9-82.4 5.1 12.3C289 264.7 323.9 288 362.7 288l21.3 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-21.3 0c-12.9 0-24.6-7.8-29.5-19.7l-6.3-15c-14.6-35.1-44.1-61.9-80.5-73.1l-48.7-15c-11.1-3.4-22.7-5.2-34.4-5.2c-31 0-60.8 12.3-82.7 34.3L57.4 153.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l23.1-23.1zM91.2 352L32 352c-17.7 0-32 14.3-32 32s14.3 32 32 32l69.6 0c19 0 36.2-11.2 43.9-28.5L157 361.6l-9.5-6c-17.5-10.9-30.5-26.8-37.9-44.9L91.2 352z"/></svg></i></div>
        <div class="status-underline"><i style="width:91%" id="staminaBar"></i></div>
      </div>

      <!-- Circular health indicator -->
      <div class="hud-circle">
        <div class="circle-base"></div>
        <svg class="ecg" viewBox="0 0 40 24" aria-hidden="true"><polyline points="0,12 12,12 15,5 19,19 22,12 40,12"/></svg>
        <div class="health-ring" id="healthRing">
          <div class="ring-hole">
            <i class="icon heart-icon heart-normal"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M228.3 469.1L47.6 300.4c-4.2-3.9-8.2-8.1-11.9-12.4l87 0c22.6 0 43-13.6 51.7-34.5l10.5-25.2 49.3 109.5c3.8 8.5 12.1 14 21.4 14.1s17.8-5 22-13.3L320 253.7l1.7 3.4c9.5 19 28.9 31 50.1 31l104.5 0c-3.7 4.3-7.7 8.5-11.9 12.4L283.7 469.1c-7.5 7-17.4 10.9-27.7 10.9s-20.2-3.9-27.7-10.9zM503.7 240l-132 0c-3 0-5.8-1.7-7.2-4.4l-23.2-46.3c-4.1-8.1-12.4-13.3-21.5-13.3s-17.4 5.1-21.5 13.3l-41.4 82.8L205.9 158.2c-3.9-8.7-12.7-14.3-22.2-14.1s-18.1 5.9-21.8 14.8l-31.8 76.3c-1.2 3-4.2 4.9-7.4 4.9L16 240c-2.6 0-5 .4-7.3 1.1C3 225.2 0 208.2 0 190.9l0-5.8c0-69.9 50.5-129.5 119.4-141C165 36.5 211.4 51.4 244 84l12 12 12-12c32.6-32.6 79-47.5 124.6-39.9C461.5 55.6 512 115.2 512 185.1l0 5.8c0 16.9-2.8 33.5-8.3 49.1z"/></svg></i>
            <i class="icon heart-icon heart-broken"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M119.4 44.1c23.3-3.9 46.8-1.9 68.6 5.3l49.8 77.5-75.4 75.4c-1.5 1.5-2.4 3.6-2.3 5.8s1 4.2 2.6 5.7l112 104c2.9 2.7 7.4 2.9 10.5 .3s3.8-7 1.7-10.4l-60.4-98.1 90.7-75.6c2.6-2.1 3.5-5.7 2.4-8.8L296.8 61.8c28.5-16.7 62.4-23.2 95.7-17.6C461.5 55.6 512 115.2 512 185.1l0 5.8c0 41.5-17.2 81.2-47.6 109.5L283.7 469.1c-7.5 7-17.4 10.9-27.7 10.9s-20.2-3.9-27.7-10.9L47.6 300.4C17.2 272.1 0 232.4 0 190.9l0-5.8c0-69.9 50.5-129.5 119.4-141z"/></svg></i>
          </div>
        </div>
        <i class="icon heal-plus" id="healBadge"><svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg></i>
      </div>

    </div>

    <!-- Identity / money -->
    <div class="hud-info">
      <div class="hud-info-id">
        <span class="hud-name" id="playerName">Centered101</span>
        <span class="hud-tag mono" id="playerId">#101</span>
      </div>
      <div class="hud-info-money">
        <div class="money-item">
          <i class="icon"><svg viewBox="0 0 576 512" xmlns="http://www.w3.org/2000/svg"><path d="M0 112.5L0 422.3c0 18 10.1 35 27 41.3c87 32.5 174 10.3 261-11.9c79.8-20.3 159.6-40.7 239.3-18.9c23 6.3 48.7-9.5 48.7-33.4l0-309.9c0-18-10.1-35-27-41.3C462 15.9 375 38.1 288 60.3C208.2 80.6 128.4 100.9 48.7 79.1C25.6 72.8 0 88.6 0 112.5zM288 352c-44.2 0-80-43-80-96s35.8-96 80-96s80 43 80 96s-35.8 96-80 96zM64 352c35.3 0 64 28.7 64 64l-64 0 0-64zm64-208c0 35.3-28.7 64-64 64l0-64 64 0zM512 304l0 64-64 0c0-35.3 28.7-64 64-64zM448 96l64 0 0 64c-35.3 0-64-28.7-64-64z"/></svg></i>
          <span class="mono" id="cashValue">$125,420</span>
        </div>
        <div class="money-item">
          <i class="icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M243.4 2.6l-224 96c-14 6-21.8 21-18.7 35.8S16.8 160 32 160l0 8c0 13.3 10.7 24 24 24l400 0c13.3 0 24-10.7 24-24l0-8c15.2 0 28.3-10.7 31.3-25.6s-4.8-29.9-18.7-35.8l-224-96c-8-3.4-17.2-3.4-25.2 0zM128 224l-64 0 0 196.3c-.6 .3-1.2 .7-1.8 1.1l-48 32c-11.7 7.8-17 22.4-12.9 35.9S17.9 512 32 512l448 0c14.1 0 26.5-9.2 30.6-22.7s-1.1-28.1-12.9-35.9l-48-32c-.6-.4-1.2-.7-1.8-1.1L448 224l-64 0 0 192-40 0 0-192-64 0 0 192-48 0 0-192-64 0 0 192-40 0 0-192zM256 64a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg></i>
          <span class="mono" id="bankValue">$850,000</span>
        </div>
      </div>
    </div>

    <!-- Quick slots: numbered hotbar, stacks under the HUD -->
    <div class="quick-slots" id="quickSlots"></div>
  </div>

  <!-- ============ ACTION PROGRESS UI (bottom-center) ============ -->
  <div class="action-row" id="actionRow">

    <div class="action-card" data-color="medkit">
      <div class="action-ring" id="ringMedkit">
        <div class="action-ring-inner">
          <i class="icon"><svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg></i>
          <span class="action-pct mono" id="pctMedkit">72%</span>
        </div>
      </div>
      <span class="action-label">Using Medkit</span>
      <i class="action-underline"></i>
    </div>

    <div class="action-card" data-color="armor">
      <div class="action-ring" id="ringArmorAction">
        <div class="action-ring-inner">
          <i class="icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8l0 378.1C394 378 431.1 230.1 432 141.4L256 66.8s0 0 0 0z"/></svg></i>
          <span class="action-pct mono" id="pctArmorAction">56%</span>
        </div>
      </div>
      <span class="action-label">Equipping Armor</span>
      <i class="action-underline"></i>
    </div>

    <div class="action-card" data-color="vehicle">
      <div class="action-ring" id="ringVehicle">
        <div class="action-ring-inner">
